services:
  - type: web
    name: signalforce
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SIGNALFORGE_COOKIE_SECURE
        value: "true"
      - key: SIGNALFORGE_PUBLIC_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SIGNALFORCE_EMAIL_FROM
        sync: false
      - key: SIGNALFORGE_READ_KEYS
        sync: false
      - key: SIGNALFORGE_ADMIN_KEYS
        sync: false
      - key: SIGNALFORCE_CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: HELIUS_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
