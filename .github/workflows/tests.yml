name: SignalForce tests

on:
  push:
    branches:
      - smart-money-tracker
      - signalforge-2.0
  pull_request:
    branches:
      - smart-money-tracker
      - signalforge-2.0
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signalforce-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Python test suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: signalforge
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: signalforge/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
