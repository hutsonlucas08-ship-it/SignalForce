name: SignalForce tests

on:
  push:
    branches:
      - smart-money-tracker
      - signalforge-2.0
      - postgresql-migration
  pull_request:
    branches:
      - smart-money-tracker
      - signalforge-2.0
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signalforce-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Python test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: signalforce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d signalforce_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: signalforge
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: signalforge/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run SQLite test suite
        run: python -m pytest -q
      - name: Run PostgreSQL integration tests
        env:
          SIGNALFORGE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/signalforce_test
        run: python -m pytest -q tests/test_postgres_integration.py
